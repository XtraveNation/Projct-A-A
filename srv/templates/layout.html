<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{block "title" .}}{{.Brand}}{{end}}</title>
<meta name="description" content="{{.Tagline}}"/>
<link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<header class="top">
  <a class="brand" href="/">✈️ {{.Brand}}</a>
  <nav>
    <a href="/pricing">Pricing</a>
    {{if and .User .User.LoggedIn}}
      <a href="/app">Dashboard</a>
      {{if .User.Admin}}<a href="/admin" class="admin-link">Admin</a>{{end}}
      <span class="who">{{.User.Email}}</span>
      <form method="POST" action="/__exe.dev/logout" style="display:inline"><button class="linkbtn">Logout</button></form>
    {{else}}
      <a class="cta" href="/__exe.dev/login?redirect=/app">Sign in</a>
    {{end}}
  </nav>
</header>
<main>
{{block "content" .}}{{end}}
</main>
<footer>
  <span>© {{.Brand}}</span>
  <a href="/privacy">Privacy</a>
  <a href="/terms">Terms</a>
</footer>
</body>
</html>
